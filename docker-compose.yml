services:
  db:
    image: postgres:16-alpine
    container_name: ghg-db
    environment:
      POSTGRES_DB: ghg
      POSTGRES_USER: ghg
      POSTGRES_PASSWORD: ghg_secret
    volumes:
      - ghg-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghg -d ghg"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghg-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: pg
      DATABASE_URL: postgres://ghg:ghg_secret@db:5432/ghg
      BASE_YEAR: "2024"
      SIGNIFICANCE_THRESHOLD: "0.05"
    ports:
      - "3000:3000"

volumes:
  ghg-pgdata:
